<!-- ======================= events/eventTimeline.html v0.1.2 ======================= -->
<!-- Alleen-lezen eventtijdlijn, hergebruik van StamboomStorage, EventStorage en LiveSearch. -->
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"> <!-- Correcte tekencodering. -->
  <meta name="viewport" content="width=device-width,initial-scale=1"> <!-- Mobiele weergave. -->
  <title>Event Timeline — MyFamTreeCollab</title> <!-- Titel van de pagina. -->
  <link rel="stylesheet" href="../css/style.css"> <!-- Bestaande globale stijl. -->
  <style>
    /* ======================= PAGINA ======================= */
    main { padding: 150px 20px 70px; max-width: 1250px; margin: auto; } /* Ruimte voor vaste navigatie. */
    .eventtl-controls { display:flex; align-items:end; flex-wrap:wrap; gap:12px; margin:20px 0; } /* Flexibele bediening. */
    .eventtl-controls label { display:flex; flex-direction:column; gap:5px; font-weight:600; } /* Labels boven velden. */
    #searchPerson { min-width:270px; width:min(410px,80vw); padding:9px; border:1px solid #adb5bd; border-radius:6px; } /* Zoekveld. */
    .eventtl-toggle { display:flex; border:1px solid #cbd5e1; border-radius:7px; overflow:hidden; } /* Weergaveknoppen. */
    .eventtl-toggle button { border:0; padding:10px 14px; background:#fff; cursor:pointer; color:#273449; } /* Standaardknop. */
    .eventtl-toggle button[aria-pressed="true"] { background:#285b95; color:white; } /* Actieve weergave. */
    .eventtl-count { color:#556575; margin:10px 0 18px; } /* Aantal gebeurtenissen. */
    .eventtl-empty { padding:28px; color:#4b5563; border:1px dashed #bac4cf; border-radius:8px; } /* Lege status. */
    /* ======================= GEDEELDE EVENTKAART ======================= */
    .eventtl-card { background:white; border:1px solid #d7dee6; border-radius:9px; padding:13px; box-shadow:0 2px 5px #0000000a; color:#202b38; } /* Gebeurteniskaart. */
    .eventtl-card h3 { font-size:1rem; margin:4px 0 8px; overflow-wrap:anywhere; } /* Eventtitel. */
    .eventtl-card p { margin:5px 0; font-size:.91rem; overflow-wrap:anywhere; } /* Detailtekst. */
    .eventtl-card .eventtl-date { font-size:.82rem; color:#52657b; font-weight:700; } /* Datum. */
    .eventtl-card details { margin-top:9px; border-top:1px solid #edf0f3; padding-top:8px; } /* Uitklapbare details. */
    .eventtl-card summary { cursor:pointer; color:#245c99; font-size:.88rem; } /* Details activeren. */
    .eventtl-card a { color:#205d9d; overflow-wrap:anywhere; } /* Externe bronlinks. */
    .eventtl-card ul { padding-left:20px; } /* Bronnenlijst. */
    /* ======================= THUMBNAILS EN MEDIA ======================= */
    .eventtl-card { display:flex; flex-direction:column; gap:8px; } /* Eventinhoud met mediastrook. */
    .eventtl-card-body { min-width:0; flex:1; } /* Tekst krimpt veilig naast miniaturen. */
    .eventtl-media { display:flex; gap:7px; flex-wrap:wrap; padding-top:8px; border-top:1px solid #edf0f3; } /* Horizontaal: miniaturen onder de inhoud. */
    .eventtl-media-link { width:54px; height:54px; flex:0 0 54px; display:flex; align-items:center; justify-content:center; border:1px solid #cad5e0; border-radius:6px; overflow:hidden; background:#f4f6f9; font-size:.65rem; text-align:center; } /* Kleine aanklikbare foto's. */
    .eventtl-media-link img { display:block; width:100%; height:100%; object-fit:cover; } /* Behoud herkenbare uitsnede. */
    .eventtl-media-error { color:#596879; padding:3px; overflow-wrap:anywhere; } /* Gebroken bron blijft herkenbaar en klikbaar. */
    .eventtl-vertical .eventtl-card { flex-direction:row; align-items:flex-start; } /* Verticaal: foto's rechts van de tekst. */
    .eventtl-vertical .eventtl-media { width:125px; flex:0 0 125px; border-top:0; padding-top:0; justify-content:flex-end; } /* Rechts uitgelijnde foto's. */
    @media(max-width:650px) { .eventtl-vertical .eventtl-card { flex-direction:column; } .eventtl-vertical .eventtl-media { width:100%; flex-basis:auto; justify-content:flex-start; border-top:1px solid #edf0f3; padding-top:8px; } } /* Mobiel: thumbnails onder de kaart. */
    /* ======================= HORIZONTALE WEERGAVE ======================= */
    .eventtl-horizontal { display:block !important; width:100%; max-width:100%; overflow-x:auto; overflow-y:visible; padding:20px 2px 28px; box-sizing:border-box; } /* Horizontaal scrollgebied ongeacht globale CSS. */
    .eventtl-horizontal > .eventtl-track { display:flex !important; flex-direction:row !important; flex-wrap:nowrap !important; align-items:flex-start; position:relative; gap:18px; width:max-content; min-width:100%; padding:28px 15px 5px; box-sizing:border-box; } /* Gebeurtenissen verplicht NAAST elkaar; nooit onder elkaar. */
    .eventtl-track:before { content:""; position:absolute; top:18px; left:25px; right:25px; height:3px; background:#9fb3c9; } /* Verbindende as. */
    .eventtl-horizontal .eventtl-track-item { display:block; flex:0 0 250px !important; width:250px; min-width:250px; max-width:250px; position:relative; padding-top:5px; } /* Elke kaart houdt vaste breedte in horizontale rij. */
    .eventtl-track-item:before { content:""; display:block; position:absolute; height:12px; width:12px; background:#3276b5; border:3px solid white; border-radius:100%; box-shadow:0 0 0 1px #3276b5; top:-16px; left:12px; } /* Tijdstip op as, verbonden aan kaart. */
    /* ======================= VERTICALE WEERGAVE ======================= */
    .eventtl-vertical { display:flex !important; flex-direction:column !important; align-items:stretch; gap:0; max-width:850px; border-left:3px solid #9fb3c9; margin:12px 0 20px 9px; padding-left:23px; } /* Gebeurtenissen verplicht ONDER elkaar. */
    .eventtl-vertical-item { display:block; width:100%; position:relative; margin-bottom:18px; } /* Volledige breedte per verticale gebeurtenis. */
    .eventtl-vertical-item:before { content:""; position:absolute; left:-34px; top:16px; width:12px; height:12px; border-radius:100%; background:#3276b5; border:3px solid white; box-shadow:0 0 0 1px #3276b5; } /* Tijdstip op as. */
    .eventtl-undated { margin-top:25px; border-top:1px solid #ddd; padding-top:16px; } /* Aparte sectie zonder datum. */
    .eventtl-undated-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; } /* Kaarten zonder datum. */
    @media(max-width:650px){main{padding-top:135px} .eventtl-horizontal .eventtl-track-item{flex-basis:225px !important;width:225px;min-width:225px;max-width:225px}} /* Kleine schermen: horizontale rij behouden. */
  </style>
</head>
<body>
  <!-- ======================= BESTAANDE PAGINACOMPONENTEN ======================= -->
  <div id="topbar-placeholder"></div> <!-- Bestaande topbar. -->
  <div id="navbar-placeholder"></div> <!-- Bestaande navigatie. -->
  <main>
    <h1>Event Timeline</h1> <!-- Paginaoverzicht. -->
    <p>Gebeurtenissen van een geselecteerde persoon, chronologisch en uitsluitend ter inzage.</p> <!-- Functieomschrijving. -->
    <!-- ======================= ZOEKEN EN PRESENTATIE ======================= -->
    <div class="eventtl-controls">
      <label for="searchPerson">Persoon zoeken <input id="searchPerson" type="search" autocomplete="off" placeholder="ID, naam of geboortedatum"></label> <!-- LiveSearch-ingang. -->
      <div class="eventtl-toggle" aria-label="Tijdlijnrichting">
        <button type="button" id="eventtlHorizontal" aria-pressed="true">Horizontaal</button> <!-- Standaard richting. -->
        <button type="button" id="eventtlVertical" aria-pressed="false">Verticaal</button> <!-- Alternatieve richting. -->
      </div>
    </div>
    <p id="eventtlSelected" aria-live="polite">Selecteer een persoon om gebeurtenissen te bekijken.</p> <!-- Selectiestatus. -->
    <p id="eventtlCount" class="eventtl-count"></p> <!-- Eventtelling. -->
    <section id="eventtlOutput" aria-label="Gebeurtenissen"><div class="eventtl-empty">Nog geen persoon geselecteerd.</div></section> <!-- Tijdsas. -->
  </main>
  <div id="footer-placeholder"></div> <!-- Bestaande footer. -->
  <!-- ======================= BESTAANDE MODULES ======================= -->
  <script src="../js/utils.js"></script> <!-- Vereist door LiveSearch. -->
  <script src="../js/schema.js"></script> <!-- Canoniek persoonsschema. -->
  <script src="../js/storage.js"></script> <!-- Bestaande persoonsopslag. -->
  <script src="../js/eventStorage.js"></script> <!-- Canonieke eventopslag. -->
  <script src="../js/LiveSearch.js"></script> <!-- Bestaande Manage-zoekfunctie. -->
  <script src="../js/eventTimeline.js"></script> <!-- Alleen-lezen timelinepresentatie. -->
</body>
</html>
